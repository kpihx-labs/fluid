# KpihX-Labs: NFS Cold Storage Manifest
# WHY: Use this StorageClass for bulk data (Media, Backups, Archives).
# It relies on a centralized NFS server instead of distributed replication.

apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-cold-storage
provisioner: cluster.local/nfs-subdir-external-provisioner
parameters:
  archiveOnDelete: "true" # WHY: Safety first, we archive instead of deleting bulk data.
mountOptions:
  - nfsvers=4.1
  - hard
  - intr
---
